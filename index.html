<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Note</title>

  <!-- Collegamento PWA e Colore Barra di Stato Android -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icone/icona.svg">
  <link rel="apple-touch-icon" href="icone/apple-touch-icon.png">
  <meta name="theme-color" content="#007bff">

  <script>
    // Applica il tema prima del render per evitare il "lampo" di colori sbagliati
    (function () {
      try {
        const t = JSON.parse(localStorage.getItem('app_contatori_tema')) || {};
        document.documentElement.dataset.mode = t.mode || 'auto';
        document.documentElement.dataset.palette = t.palette || 'blu';
      } catch (e) {}
    })();
  </script>

  <style>
    * { box-sizing: border-box; }

    /* ===== Colori: tema chiaro ===== */
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-2: #e9ecef;
      --text: #333333;
      --text-muted: #6c757d;
      --border: #ced4da;
      --shadow: 0 2px 6px rgba(0,0,0,0.08);
      --shadow-pop: 0 8px 24px rgba(0,0,0,0.18);
      --overlay: rgba(0,0,0,0.4);
      --danger: #dc3545;
      --primary: #007bff;
      --on-primary: #ffffff;
    }

    /* ===== Colori: tema scuro (manuale o automatico) ===== */
    :root[data-mode="dark"] {
      --bg: #121418;
      --surface: #1f2228;
      --surface-2: #2b2f37;
      --text: #e8eaed;
      --text-muted: #9aa0a6;
      --border: #3c4049;
      --shadow: 0 2px 6px rgba(0,0,0,0.4);
      --shadow-pop: 0 8px 24px rgba(0,0,0,0.6);
      --overlay: rgba(0,0,0,0.6);
      --danger: #f2545b;
    }
    @media (prefers-color-scheme: dark) {
      :root[data-mode="auto"] {
        --bg: #121418;
        --surface: #1f2228;
        --surface-2: #2b2f37;
        --text: #e8eaed;
        --text-muted: #9aa0a6;
        --border: #3c4049;
        --shadow: 0 2px 6px rgba(0,0,0,0.4);
        --shadow-pop: 0 8px 24px rgba(0,0,0,0.6);
        --overlay: rgba(0,0,0,0.6);
        --danger: #f2545b;
      }
    }

    /* ===== Palette colori ===== */
    :root[data-palette="blu"]     { --primary: #007bff; }
    :root[data-palette="verde"]   { --primary: #28a745; }
    :root[data-palette="viola"]   { --primary: #7c4dff; }
    :root[data-palette="arancio"] { --primary: #f57c00; }
    :root[data-palette="rosso"]   { --primary: #e53935; }
    :root[data-palette="rosa"]    { --primary: #d81b60; }
    :root[data-palette="acqua"]   { --primary: #00897b; }
    :root[data-palette="grafite"] { --primary: #546e7a; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      transition: background 0.2s ease, color 0.2s ease;
    }
    svg.ico { width: 20px; height: 20px; flex-shrink: 0; }

    /* ===== Barra superiore ===== */
    .topbar {
      position: relative;
      width: 100%;
      max-width: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 4px 0 14px;
      min-height: 36px;
    }
    .btn-menu {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 1.3rem;
      line-height: 1;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-menu:active { background: var(--surface-2); }
    h2 { margin: 0; padding: 0 44px; font-size: 1.25rem; color: var(--text); text-align: center; word-break: break-word; }

    /* ===== Menu laterale ===== */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: var(--overlay);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 10;
    }
    .drawer-overlay.open { opacity: 1; pointer-events: auto; }

    .drawer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 78%;
      max-width: 300px;
      background: var(--surface);
      box-shadow: 2px 0 12px rgba(0,0,0,0.25);
      transform: translateX(-105%);
      transition: transform 0.25s ease;
      z-index: 11;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
    }
    .drawer.open { transform: translateX(0); }

    .drawer-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0 24px 12px;
    }
    .drawer-item {
      display: flex;
      align-items: center;
      gap: 16px;
      width: calc(100% - 12px);
      padding: 12px 24px;
      border: none;
      border-radius: 0 24px 24px 0;
      background: transparent;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
    }
    .drawer-item:active { background: var(--surface-2); }
    .drawer-item.active {
      background: color-mix(in srgb, var(--primary) 18%, transparent);
      color: var(--primary);
      font-weight: 600;
    }
    .drawer-item .badge {
      margin-left: auto;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: normal;
    }
    .drawer-spacer { flex: 1; }
    .drawer-sep { height: 1px; background: var(--border); margin: 8px 20px; flex-shrink: 0; }

    /* ===== Pagine ===== */
    .page { width: 100%; display: none; flex-direction: column; align-items: center; }
    .page.active { display: flex; }

    /* Pulsante "+" in alto a destra */
    .btn-nuovo {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: var(--primary);
      color: var(--on-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
    }
    .btn-nuovo[hidden] { display: none; }
    .btn-nuovo:active { filter: brightness(0.9); }

    /* ===== Modulo nel popup ===== */
    .form { display: flex; flex-direction: column; gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; color: var(--text-muted); }
    .field em { font-style: normal; opacity: 0.8; }
    .field input {
      padding: 9px 10px; font-size: 0.9rem; font-family: inherit;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface); color: var(--text);
      user-select: text; -webkit-user-select: text;
    }
    .field input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 20%, transparent); }
    .field input.invalid { border-color: var(--danger); }

    /* Sezione "Avanzate" del popup contatore */
    .adv-toggle {
      align-self: flex-start;
      display: flex; align-items: center; gap: 4px;
      padding: 4px 6px 4px 2px; margin-top: -2px;
      border: none; background: transparent; border-radius: 6px;
      color: var(--primary); font-size: 0.82rem; font-weight: 600; font-family: inherit; cursor: pointer;
    }
    .adv-toggle svg.ico { width: 18px; height: 18px; transition: transform 0.2s ease; }
    .adv-toggle.open svg.ico { transform: rotate(180deg); }
    .adv-section {
      display: flex; flex-direction: column; gap: 10px;
      padding: 12px; border-radius: 10px; background: var(--surface-2);
    }
    .adv-section[hidden], .formula-box[hidden] { display: none; }
    .check { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; color: var(--text); cursor: pointer; }
    .check input { width: 18px; height: 18px; accent-color: var(--primary); margin: 0; }
    .formula-box { display: flex; flex-direction: column; gap: 6px; }
    .formula-input {
      padding: 9px 10px; font-size: 0.9rem;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface); color: var(--text);
      user-select: text; -webkit-user-select: text;
    }
    .formula-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 20%, transparent); }
    .formula-input.invalid { border-color: var(--danger); }
    .formula-help { font-size: 0.72rem; color: var(--text-muted); line-height: 1.4; }
    .formula-preview { font-size: 0.82rem; font-weight: 600; color: var(--primary); }
    .formula-preview.error { color: var(--danger); font-weight: 500; }

    /* ===== Pagina contatori ===== */

    .list { width: 100%; max-width: 400px; display: flex; flex-direction: column; }

    .card {
      position: relative;
      background: var(--surface);
      border-radius: 8px;
      padding: 10px 6px 10px 14px;
      margin-bottom: 10px;
      width: 100%;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 10px;
      transition: box-shadow 0.15s ease, outline-color 0.15s ease;
      outline: 2px solid transparent;
    }

    /* Card mentre viene trascinata */
    .card.dragging {
      z-index: 5;
      box-shadow: var(--shadow-pop);
      outline-color: var(--primary);
      transition: none;
    }
    /* Card in modalità "Sposta" */
    .card.moving { outline-color: var(--primary); cursor: grab; }
    body.is-dragging, body.is-dragging * { cursor: grabbing !important; }

    .card-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .card-title { font-size: 0.9rem; font-weight: 600; color: var(--text); word-break: break-word; }

    /* Nota/Data sotto al titolo */
    .card-note {
      font-size: 0.72rem;
      color: var(--text-muted);
      outline: none;
      border-bottom: 1px dashed transparent;
      padding: 1px 2px;
      border-radius: 3px;
      user-select: text;
      -webkit-user-select: text;
    }
    .card-note:focus {
      background: var(--surface-2);
      border-bottom-color: var(--primary);
      color: var(--text);
    }

    .controls { display: flex; align-items: center; gap: 5px; }
    .btn-step {
      width: 30px; height: 30px; font-size: 0.95rem; border: none; border-radius: 6px;
      background: var(--primary); color: var(--on-primary); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-step:disabled { opacity: 0.35; cursor: default; }
    /* Colonna valore + risultato formula */
    .value-col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .controls.con-formula { align-items: flex-start; }
    .formula-result {
      width: 56px; padding: 2px 4px; border-radius: 5px;
      background: color-mix(in srgb, var(--primary) 14%, transparent);
      color: var(--primary); font-size: 0.72rem; font-weight: 700; text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .counter-input {
      width: 56px; height: 30px; text-align: center; font-size: 0.9rem; font-weight: bold;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--surface); color: var(--text);
    }
    .btn-more {
      width: 30px; height: 30px; border: none; border-radius: 50%;
      background: transparent; color: var(--text-muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-more:active, .btn-more.open { background: var(--surface-2); color: var(--text); }
    .btn-done {
      height: 30px; padding: 0 12px; border: none; border-radius: 6px;
      background: var(--primary); color: var(--on-primary); font-weight: bold; font-size: 0.85rem; cursor: pointer;
    }
    .move-hint { font-size: 0.72rem; color: var(--primary); }

    .empty { color: var(--text-muted); font-size: 0.9rem; text-align: center; margin-top: 24px; }

    /* ===== Menu azioni (⋮) ===== */
    .pop-overlay { position: fixed; inset: 0; z-index: 20; display: none; }
    .pop-overlay.open { display: block; }
    .pop-menu {
      position: fixed;
      min-width: 170px;
      background: var(--surface);
      border-radius: 14px;
      box-shadow: var(--shadow-pop);
      padding: 6px;
      z-index: 21;
      display: none;
      transform-origin: top right;
      animation: pop 0.12s ease-out;
    }
    .pop-menu.open { display: block; }
    @keyframes pop { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
    .pop-item {
      display: flex; align-items: center; gap: 12px;
      width: 100%; padding: 10px 12px;
      border: none; border-radius: 10px; background: transparent;
      color: var(--text); font-size: 0.9rem; font-family: inherit; text-align: left; cursor: pointer;
    }
    .pop-item:hover, .pop-item:active { background: var(--surface-2); }
    .pop-item.danger { color: var(--danger); }
    .pop-item svg.ico { width: 18px; height: 18px; }

    /* ===== Finestra modale ===== */
    .modal-overlay {
      position: fixed; inset: 0; background: var(--overlay); z-index: 30;
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      width: 100%; max-width: 360px; background: var(--surface); color: var(--text);
      border-radius: 16px; box-shadow: var(--shadow-pop); padding: 18px;
      animation: pop 0.15s ease-out;
    }
    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .modal-head h3 { margin: 0; font-size: 1rem; }
    .modal-close {
      width: 30px; height: 30px; border: none; border-radius: 50%; background: transparent;
      color: var(--text-muted); font-size: 1.1rem; cursor: pointer;
    }
    .modal-close:active { background: var(--surface-2); }
    .modal-body { min-height: 120px; font-size: 0.9rem; color: var(--text-muted); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .modal-actions.divisi { justify-content: space-between; }
    .btn {
      padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: transparent; color: var(--text); font-size: 0.85rem; font-family: inherit; cursor: pointer;
    }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); font-weight: 600; }
    .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
    .btn.danger-outline { border-color: var(--danger); color: var(--danger); }
    .btn.primary-outline { border-color: var(--primary); color: var(--primary); }

    /* ===== Sezioni (Tema, Impostazioni, Cestino) ===== */
    .section {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 14px 16px;
      margin-bottom: 14px;
    }
    .section h3 { margin: 0 0 12px; font-size: 0.95rem; }
    .settings-group-title {
      width: 100%; max-width: 400px;
      font-size: 0.75rem; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.05em;
      margin: 0 0 8px 4px;
    }
    .muted { color: var(--text-muted); font-size: 0.85rem; margin: 0; }

    /* ===== Pagina tema ===== */
    .mode-options { display: flex; gap: 8px; }
    .mode-btn {
      flex: 1;
      padding: 10px 6px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      font-size: 0.85rem;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .mode-btn .ico { font-size: 1.2rem; }
    .mode-btn.selected {
      border-color: var(--primary);
      background: color-mix(in srgb, var(--primary) 14%, transparent);
      color: var(--primary);
      font-weight: 600;
    }

    .palette-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .swatch {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.75rem;
      font-family: inherit;
      cursor: pointer;
      padding: 0;
    }
    .swatch-dot {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      box-shadow: 0 0 0 2px var(--surface), 0 0 0 2px transparent;
      transition: box-shadow 0.15s ease;
    }
    .swatch.selected .swatch-dot { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--text); }
    .swatch.selected { font-weight: 600; }

    /* ===== Obiettivi: elenco ===== */
    .goal-card { cursor: pointer; padding-top: 12px; padding-bottom: 12px; }
    .goal-desc-short {
      font-size: 0.72rem; color: var(--text-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* Indicatore circolare della percentuale */
    .ring {
      --p: 0;
      width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
      background: conic-gradient(var(--primary) calc(var(--p) * 1%), var(--surface-2) 0);
      display: grid; place-items: center; position: relative;
    }
    .ring::before {
      content: ''; position: absolute; inset: 4px; border-radius: 50%; background: var(--surface);
    }
    .ring span { position: relative; font-size: 0.68rem; font-weight: 700; color: var(--text); }

    /* ===== Obiettivi: dettaglio ===== */
    .topbar-dettaglio h2 { font-size: 1.1rem; }
    h2.editable {
      cursor: text; outline: none; border-radius: 6px;
      user-select: text; -webkit-user-select: text;
    }
    h2.editable:focus { background: var(--surface-2); box-shadow: 0 0 0 4px var(--surface-2); }
    .top-percent {
      position: absolute; right: 0; top: 50%; transform: translateY(-50%);
      min-width: 36px; text-align: right;
      font-size: 0.95rem; font-weight: 700; color: var(--primary);
    }
    .top-percent[hidden] { display: none; }

    .goal-detail {
      width: 100%; max-width: 400px;
      height: calc(100vh - 86px); height: calc(100dvh - 86px);
      display: flex; flex-direction: column; gap: 14px;
    }
    .goal-desc {
      font-size: 0.85rem; color: var(--text-muted); text-align: center;
      outline: none; padding: 2px 4px; border-radius: 4px;
      user-select: text; -webkit-user-select: text;
    }
    .goal-desc:focus { background: var(--surface-2); color: var(--text); }
    .goal-desc:empty::before { content: attr(data-placeholder); opacity: 0.6; }

    /* Slider sottile: la parte riempita usa il colore principale */
    .slider {
      --p: 0;
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 4px; margin: 6px 0; border-radius: 2px; outline: none; cursor: pointer;
      background: linear-gradient(to right, var(--primary) calc(var(--p) * 1%), var(--surface-2) 0);
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--primary); border: 3px solid var(--surface); box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }
    .slider::-moz-range-thumb {
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--primary); border: 3px solid var(--surface); box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    .goal-notes {
      flex: 1; width: 100%; resize: none;
      padding: 12px 14px; border: none; border-radius: 8px;
      background: var(--surface); color: var(--text); box-shadow: var(--shadow);
      font-size: 0.9rem; font-family: inherit; line-height: 1.5;
      user-select: text; -webkit-user-select: text;
    }
    .goal-notes:focus { outline: 2px solid color-mix(in srgb, var(--primary) 40%, transparent); }

    /* ===== Lista della spesa (blocco note) ===== */
    .note-sheet {
      width: 100%; max-width: 400px;
      min-height: calc(100vh - 86px); min-height: calc(100dvh - 86px);
      background: var(--surface); border-radius: 8px; box-shadow: var(--shadow);
      padding: 8px 14px 40px; cursor: text;
    }
    .note-line { display: flex; align-items: center; gap: 10px; min-height: 36px; }
    .note-line input[type="checkbox"] {
      width: 18px; height: 18px; margin: 0; flex-shrink: 0;
      accent-color: var(--primary); cursor: pointer;
      opacity: 0.55;
    }
    .note-text {
      flex: 1; min-width: 0; padding: 6px 0;
      border: none; outline: none; background: transparent;
      font-size: 0.95rem; font-family: inherit;
      color: var(--text); opacity: 0.4;
      transition: opacity 0.15s ease;
      user-select: text; -webkit-user-select: text;
    }
    .note-text::placeholder { color: var(--text-muted); }
    /* Spuntata = da comprare: testo pieno e contrastato */
    .note-line.checked .note-text { opacity: 1; font-weight: 500; }
    .note-line.checked input[type="checkbox"] { opacity: 1; }
    .note-line + .note-line { border-top: 1px solid color-mix(in srgb, var(--border) 50%, transparent); }

    #page-spesa { padding-bottom: 56px; }
    #page-spesa .note-sheet { min-height: calc(100vh - 150px); min-height: calc(100dvh - 150px); }

    /* Pulsante "Condividi" in alto a destra */
    .btn-condividi {
      position: absolute; right: 0; top: 50%; transform: translateY(-50%);
      display: flex; align-items: center; gap: 5px;
      height: 32px; padding: 0 12px; border: none; border-radius: 16px;
      background: var(--primary); color: var(--on-primary);
      font-size: 0.8rem; font-weight: 600; font-family: inherit; cursor: pointer;
    }
    .btn-condividi[hidden] { display: none; }
    .btn-condividi svg.ico { width: 15px; height: 15px; }
    .topbar:has(#btnCondividi:not([hidden])) h2 { padding-right: 104px; padding-left: 104px; }

    /* Barra delle tab in basso */
    .tab-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
      display: flex; gap: 6px; align-items: flex-end;
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
      background: var(--bg); border-top: 1px solid var(--border);
      overflow-x: auto; scrollbar-width: none;
    }
    .tab-bar::-webkit-scrollbar { display: none; }
    .tab-bar[hidden] { display: none; }
    .tab {
      flex-shrink: 0; display: flex; align-items: center; gap: 4px;
      height: 34px; padding: 0 14px; border-radius: 17px;
      background: var(--surface); color: var(--text-muted); box-shadow: var(--shadow);
      font-size: 0.85rem; font-family: inherit; cursor: pointer; border: none;
      white-space: nowrap;
    }
    .tab.active {
      background: var(--primary); color: var(--on-primary); font-weight: 600; padding-right: 8px;
    }
    .tab.active:not(:has(.tab-close)) { padding-right: 14px; }
    .tab-add { width: 34px; padding: 0; justify-content: center; font-size: 1.2rem; font-weight: 600; color: var(--primary); }
    .tab-close {
      width: 20px; height: 20px; border: none; border-radius: 50%;
      background: rgba(255,255,255,0.25); color: inherit; font-size: 0.65rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .tab-input {
      border: none; outline: none; background: rgba(255,255,255,0.2); color: inherit;
      font: inherit; padding: 2px 6px; border-radius: 6px; min-width: 40px;
      user-select: text; -webkit-user-select: text;
    }

    /* Messaggio temporaneo */
    .toast {
      position: fixed; left: 50%; bottom: 70px; z-index: 40;
      transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
      max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 10px;
      background: var(--text); color: var(--bg); font-size: 0.85rem; text-align: center;
      box-shadow: var(--shadow-pop); transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ===== Pagina cestino ===== */
    .trash-bar {
      width: 100%; max-width: 400px; display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .trash-item { flex-wrap: wrap; padding: 12px 14px; }
    .trash-item .card-info { flex-basis: 100%; }
    .trash-meta { font-size: 0.72rem; color: var(--text-muted); }
    .trash-actions { display: flex; gap: 8px; width: 100%; justify-content: flex-end; }
  </style>
</head>
<body>

  <!-- Barra superiore con pulsante menu -->
  <header class="topbar">
    <button class="btn-menu" id="btnMenu" aria-label="Apri menu" onclick="onPulsanteSinistro()">☰</button>
    <h2 id="titoloPagina" spellcheck="false" onblur="salvaTitoloDettaglio()" oninput="onInputTitolo()" onkeydown="onTastoTitolo(event)">I Miei Contatori</h2>
    <span class="top-percent" id="topPercent" hidden>0%</span>
    <button class="btn-condividi" id="btnCondividi" hidden onclick="apriMenuCondividi(this)">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.59 13.51 6.83 3.98M15.41 6.51l-6.82 3.98"/></svg>
      Condividi
    </button>
    <button class="btn-nuovo" id="btnNuovo" aria-label="Nuovo contatore" onclick="apriNuovo()">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>

  <!-- Menu laterale -->
  <div class="drawer-overlay" id="drawerOverlay" onclick="chiudiMenu()"></div>
  <nav class="drawer" id="drawer" aria-label="Menu principale">
    <div class="drawer-title">Menu</div>
    <button class="drawer-item" data-page="contatori" onclick="mostraPagina('contatori')">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/></svg>
      I miei contatori
    </button>
    <button class="drawer-item" data-page="obiettivi" onclick="mostraPagina('obiettivi')">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
      Obiettivi
    </button>
    <button class="drawer-item" data-page="spesa" onclick="mostraPagina('spesa')">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      Lista della Spesa
    </button>
    <button class="drawer-item" data-page="cestino" onclick="mostraPagina('cestino')">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/></svg>
      Cestino
      <span class="badge" id="badgeCestino"></span>
    </button>
    <div class="drawer-sep"></div>

    <div class="drawer-spacer"></div>
    <div class="drawer-sep"></div>
    <button class="drawer-item" data-page="impostazioni" onclick="mostraPagina('impostazioni')">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Impostazioni
    </button>
  </nav>

  <!-- Pagina: I miei contatori -->
  <main class="page" id="page-contatori">
    <div class="list" id="app"></div>
  </main>

  <!-- Pagina: Obiettivi -->
  <main class="page" id="page-obiettivi">
    <div class="list" id="listaObiettivi"></div>
  </main>

  <!-- Pagina: dettaglio di un obiettivo (titolo e % sono nella barra in alto) -->
  <main class="page" id="page-obiettivo">
    <div class="goal-detail">
      <div class="goal-desc" id="goalDesc" contenteditable="true" data-placeholder="Aggiungi una descrizione..."
           onblur="modificaObiettivo('descrizione', this.innerText.trim())"></div>
      <input type="range" class="slider" id="goalSlider" min="0" max="100" step="1" value="0"
             aria-label="Percentuale di completamento" oninput="onSlider(this.value)" />
      <textarea class="goal-notes" id="goalNotes" placeholder="Scrivi qui le tue note..."
                oninput="modificaObiettivo('note', this.value)"></textarea>
    </div>
  </main>

  <!-- Pagina: Lista della Spesa -->
  <main class="page" id="page-spesa">
    <div class="note-sheet" id="listaSpesa" onclick="if (event.target === this) focusUltimaRiga()"></div>
  </main>

  <!-- Tab in basso della Lista della Spesa -->
  <nav class="tab-bar" id="tabSpesa" role="tablist" hidden></nav>

  <!-- Menù a tendina "Condividi" -->
  <div class="pop-menu" id="shareMenu" role="menu">
    <button class="pop-item" role="menuitem" onclick="condividi(false)">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Condividi Tab
    </button>
    <button class="pop-item" role="menuitem" onclick="condividi(true)">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      Condividi Tutto
    </button>
  </div>

  <!-- Messaggio temporaneo -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Pagina: Cestino -->
  <main class="page" id="page-cestino">
    <div class="trash-bar" id="trashBar"></div>
    <div class="list" id="trashList"></div>
  </main>

  <!-- Pagina: Impostazioni -->
  <main class="page" id="page-impostazioni">
    <div class="settings-group-title">Tema</div>
    <section class="section">
      <h3>Aspetto</h3>
      <div class="mode-options" id="modeOptions"></div>
    </section>
    <section class="section">
      <h3>Colore principale</h3>
      <div class="palette-grid" id="paletteGrid"></div>
    </section>
  </main>

  <!-- Menu azioni del singolo contatore -->
  <div class="pop-overlay" id="popOverlay" onclick="chiudiAzioni()"></div>
  <div class="pop-menu" id="popMenu" role="menu">
    <button class="pop-item" role="menuitem" onclick="azione('modifica')">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      Modifica
    </button>
    <button class="pop-item" role="menuitem" onclick="azione('sposta')">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M8 6l4-4 4 4M8 18l4 4 4-4"/></svg>
      Sposta
    </button>
    <button class="pop-item danger" role="menuitem" onclick="azione('elimina')">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      Elimina
    </button>
  </div>

  <!-- Finestra modale generica -->
  <div class="modal-overlay" id="modalOverlay" onclick="if (event.target === this) chiudiModale()">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="modalTitolo"></h3>
        <button class="modal-close" aria-label="Chiudi" onclick="chiudiModale()">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'app_contatori_data_v2';
    const TRASH_KEY = 'app_contatori_cestino';
    const GOALS_KEY = 'app_contatori_obiettivi';
    const SPESA_KEY = 'app_contatori_spesa';           // vecchio formato (una sola lista), letto solo per migrazione
    const SPESA_TABS_KEY = 'app_contatori_spesa_tabs';
    const THEME_KEY = 'app_contatori_tema';

    const ICONA_PUNTINI = '<svg class="ico" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>';

    // ===================== TEMA =====================
    const MODI = [
      { id: 'light', nome: 'Chiaro', ico: '☀️' },
      { id: 'dark',  nome: 'Scuro',  ico: '🌙' },
      { id: 'auto',  nome: 'Sistema', ico: '📱' }
    ];
    const PALETTE = [
      { id: 'blu',     nome: 'Blu',     colore: '#007bff' },
      { id: 'verde',   nome: 'Verde',   colore: '#28a745' },
      { id: 'viola',   nome: 'Viola',   colore: '#7c4dff' },
      { id: 'arancio', nome: 'Arancio', colore: '#f57c00' },
      { id: 'rosso',   nome: 'Rosso',   colore: '#e53935' },
      { id: 'rosa',    nome: 'Rosa',    colore: '#d81b60' },
      { id: 'acqua',   nome: 'Acqua',   colore: '#00897b' },
      { id: 'grafite', nome: 'Grafite', colore: '#546e7a' }
    ];

    let tema = { mode: 'auto', palette: 'blu' };
    try { tema = { ...tema, ...(JSON.parse(localStorage.getItem(THEME_KEY)) || {}) }; } catch (e) {}

    function applicaTema() {
      const root = document.documentElement;
      root.dataset.mode = tema.mode;
      root.dataset.palette = tema.palette;
      const p = PALETTE.find(x => x.id === tema.palette) || PALETTE[0];
      document.querySelector('meta[name="theme-color"]').setAttribute('content', p.colore);
      renderTema();
    }

    function impostaTema(campo, valore) {
      tema[campo] = valore;
      try { localStorage.setItem(THEME_KEY, JSON.stringify(tema)); } catch (e) {}
      applicaTema();
    }

    function renderTema() {
      document.getElementById('modeOptions').innerHTML = MODI.map(m => `
        <button class="mode-btn ${tema.mode === m.id ? 'selected' : ''}" onclick="impostaTema('mode', '${m.id}')">
          <span class="ico">${m.ico}</span>${m.nome}
        </button>`).join('');

      document.getElementById('paletteGrid').innerHTML = PALETTE.map(p => `
        <button class="swatch ${tema.palette === p.id ? 'selected' : ''}" onclick="impostaTema('palette', '${p.id}')">
          <span class="swatch-dot" style="background:${p.colore}">${tema.palette === p.id ? '✓' : ''}</span>
          ${p.nome}
        </button>`).join('');
    }

    // ===================== NAVIGAZIONE =====================
    const TITOLI = {
      contatori: 'I Miei Contatori',
      obiettivi: 'Obiettivi',
      spesa: 'Lista della Spesa',
      cestino: 'Cestino',
      impostazioni: 'Impostazioni'
    };
    const ICONA_MENU = '☰';
    const ICONA_INDIETRO = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>';

    let paginaCorrente = 'contatori';

    function apriMenu() {
      document.getElementById('drawer').classList.add('open');
      document.getElementById('drawerOverlay').classList.add('open');
    }

    function chiudiMenu() {
      document.getElementById('drawer').classList.remove('open');
      document.getElementById('drawerOverlay').classList.remove('open');
    }

    // Pulsante in alto a sinistra: menu nelle pagine normali, "indietro" nel dettaglio obiettivo
    function onPulsanteSinistro() {
      if (paginaCorrente === 'obiettivo') tornaAgliObiettivi();
      else apriMenu();
    }

    function mostraPagina(nome) {
      // Uscendo dal dettaglio, conferma il titolo (se lasciato vuoto torna quello precedente)
      if (paginaCorrente === 'obiettivo') salvaTitoloDettaglio();
      fineSposta();
      paginaCorrente = nome;
      const dettaglio = nome === 'obiettivo';
      // Il titolo in alto è modificabile solo nel dettaglio di un obiettivo
      const titolo = document.getElementById('titoloPagina');
      titolo.contentEditable = dettaglio ? 'true' : 'false';
      titolo.classList.toggle('editable', dettaglio);
      const voceMenu = dettaglio ? 'obiettivi' : nome;

      document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + nome));
      document.querySelectorAll('.drawer-item').forEach(b => b.classList.toggle('active', b.dataset.page === voceMenu));

      const btnSx = document.getElementById('btnMenu');
      btnSx.innerHTML = dettaglio ? ICONA_INDIETRO : ICONA_MENU;
      btnSx.setAttribute('aria-label', dettaglio ? 'Torna agli obiettivi' : 'Apri menu');

      document.getElementById('btnNuovo').hidden = !(nome === 'contatori' || nome === 'obiettivi');
      document.getElementById('btnCondividi').hidden = nome !== 'spesa';
      document.getElementById('tabSpesa').hidden = nome !== 'spesa';
      document.getElementById('topPercent').hidden = !dettaglio;
      document.querySelector('.topbar').classList.toggle('topbar-dettaglio', dettaglio);

      if (dettaglio) renderDettaglio();
      else document.getElementById('titoloPagina').textContent = TITOLI[nome];

      if (nome === 'obiettivi') renderObiettivi();
      if (nome === 'cestino') renderCestino();
      if (nome === 'spesa') renderSpesa();
      chiudiMenu();
      window.scrollTo(0, 0);
    }

    // Il "+" in alto a destra crea un elemento del tipo della pagina corrente
    function apriNuovo() {
      if (paginaCorrente === 'obiettivi') apriFormObiettivo();
      else apriFormContatore();
    }

    // Chiusura del menu con swipe da destra verso sinistra, partendo da qualsiasi punto dello schermo.
    // Il menu segue il dito; se lo trascini abbastanza a sinistra si chiude, altrimenti torna al suo posto.
    let swipe = null;

    function menuAperto() { return document.getElementById('drawer').classList.contains('open'); }

    function swipeInizio(x, y) {
      if (!menuAperto()) return;
      swipe = { x, y, dx: 0, attivo: false };
    }

    function swipeMovimento(x, y, e) {
      if (!swipe) return;
      const dx = x - swipe.x, dy = y - swipe.y;
      if (!swipe.attivo) {
        if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
        // Solo gesti orizzontali verso sinistra
        if (dx >= 0 || Math.abs(dy) > Math.abs(dx)) { swipe = null; return; }
        swipe.attivo = true;
        document.getElementById('drawer').style.transition = 'none';
      }
      if (e && e.cancelable) e.preventDefault();
      swipe.dx = Math.min(0, dx);
      const drawer = document.getElementById('drawer');
      drawer.style.transform = `translateX(${swipe.dx}px)`;
      document.getElementById('drawerOverlay').style.opacity = String(Math.max(0, 1 + swipe.dx / drawer.offsetWidth));
    }

    function swipeFine() {
      if (!swipe) return;
      const { attivo, dx } = swipe;
      swipe = null;
      if (!attivo) return;
      const drawer = document.getElementById('drawer');
      const overlay = document.getElementById('drawerOverlay');
      drawer.style.transition = '';
      drawer.style.transform = '';
      overlay.style.opacity = '';
      if (dx < -Math.min(60, drawer.offsetWidth * 0.25)) chiudiMenu();
      // Evita che il rilascio dello swipe venga letto come un tocco su una voce del menu
      window.addEventListener('click', bloccaClick, true);
      setTimeout(() => window.removeEventListener('click', bloccaClick, true), 300);
    }

    function bloccaClick(ev) {
      ev.stopPropagation();
      ev.preventDefault();
      window.removeEventListener('click', bloccaClick, true);
    }

    document.addEventListener('touchstart', e => swipeInizio(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
    document.addEventListener('touchmove', e => swipeMovimento(e.touches[0].clientX, e.touches[0].clientY, e), { passive: false });
    document.addEventListener('touchend', swipeFine);
    document.addEventListener('touchcancel', swipeFine);
    // Anche con il mouse (utile sul computer)
    document.addEventListener('mousedown', e => swipeInizio(e.clientX, e.clientY));
    document.addEventListener('mousemove', e => swipeMovimento(e.clientX, e.clientY, null));
    document.addEventListener('mouseup', swipeFine);

    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      chiudiMenu();
      chiudiAzioni();
      chiudiModale();
      fineSposta();
    });

    // ===================== DATI =====================
    function leggi(chiave, predefinito) {
      try { return JSON.parse(localStorage.getItem(chiave)) || predefinito; } catch (e) { return predefinito; }
    }

    let contatori = leggi(STORAGE_KEY, [
      { id: 1, titolo: 'Flessioni', nota: 'Aggiungi nota o data...', valore: 10 }
    ]);
    let obiettivi = leggi(GOALS_KEY, []);
    let cestino = leggi(TRASH_KEY, []);

    // Il salvataggio non deve mai bloccare l'aggiornamento della schermata:
    // se lo storage non è disponibile (es. anteprima, navigazione privata) l'app continua a funzionare in memoria.
    function scrivi(chiave, valore) {
      try { localStorage.setItem(chiave, JSON.stringify(valore)); }
      catch (e) { console.warn('Salvataggio non riuscito:', e.message); }
    }

    function salvaStato() { scrivi(STORAGE_KEY, contatori); }
    function salvaObiettivi() { scrivi(GOALS_KEY, obiettivi); }
    function salvaCestino() {
      scrivi(TRASH_KEY, cestino);
      aggiornaBadgeCestino();
    }

    // Le operazioni comuni (sposta, elimina, ripristina) funzionano su entrambe le liste
    const LISTE = {
      contatore: { get: () => contatori, salva: () => salvaStato(),     render: () => render() },
      obiettivo: { get: () => obiettivi, salva: () => salvaObiettivi(), render: () => renderObiettivi() }
    };

    function renderListe() {
      render();
      renderObiettivi();
    }

    // ===================== CONTATORI =====================
    function modificaPulsante(id, delta) {
      contatori = contatori.map(c => c.id === id ? { ...c, valore: Number(c.valore) + delta } : c);
      salvaStato();
      render();
    }

    function modificaDiretta(id, nuovoValoreTesto) {
      const valoreNumerico = parseInt(nuovoValoreTesto, 10);
      contatori = contatori.map(c => c.id === id ? { ...c, valore: isNaN(valoreNumerico) ? 0 : valoreNumerico } : c);
      salvaStato();
      // Aggiorna subito il risultato della formula, senza ridisegnare la card (il campo resta in modifica)
      const box = document.getElementById('ris-' + id);
      const c = contatori.find(x => x.id === id);
      if (box && c) box.textContent = testoRisultato(c);
    }

    function modificaNota(id, nuovaNota) {
      contatori = contatori.map(c => c.id === id ? { ...c, nota: nuovaNota } : c);
      salvaStato();
    }

    // ===================== FORMULE =====================
    // Valutatore di formule stile Excel, senza eval: numeri, la variabile "Valore",
    // + - * / ^ e parentesi. Es: "=Valore*3", "=(Valore+2)^2", "=Valore^(1/2)".
    // Precedenze: ^ (da destra) > segno meno > * / > + -
    function valutaFormula(testo, valore) {
      let s = String(testo || '').trim();
      if (s.startsWith('=')) s = s.slice(1);
      if (!s.trim()) throw new Error('Formula vuota');

      // Suddivisione in token
      const tokens = [];
      const re = /\s*(?:(\d+(?:[.,]\d+)?|[.,]\d+)|([A-Za-zÀ-ÿ_]+)|(\S))/gy;
      let m;
      while (re.lastIndex < s.length && (m = re.exec(s))) {
        if (m[1] !== undefined) tokens.push({ t: 'num', v: parseFloat(m[1].replace(',', '.')) });
        else if (m[2] !== undefined) {
          if (m[2].toLowerCase() !== 'valore') throw new Error(`"${m[2]}" non riconosciuto (usa "Valore")`);
          tokens.push({ t: 'num', v: Number(valore) || 0 });
        } else if (m[3] !== undefined) {
          if (!'+-*/^()'.includes(m[3])) throw new Error(`Simbolo "${m[3]}" non valido`);
          tokens.push({ t: m[3] });
        } else break; // solo spazi finali
      }

      let i = 0;
      const vedi = () => tokens[i] && tokens[i].t;
      const prendi = t => { if (vedi() !== t) throw new Error(t === ')' ? 'Manca una parentesi chiusa' : 'Formula incompleta'); i++; };

      function somma() {
        let v = prodotto();
        while (vedi() === '+' || vedi() === '-') v = tokens[i++].t === '+' ? v + prodotto() : v - prodotto();
        return v;
      }
      function prodotto() {
        let v = segno();
        while (vedi() === '*' || vedi() === '/') v = tokens[i++].t === '*' ? v * segno() : v / segno();
        return v;
      }
      function segno() {
        if (vedi() === '-') { i++; return -segno(); }
        if (vedi() === '+') { i++; return segno(); }
        return potenza();
      }
      function potenza() {
        const base = primario();
        if (vedi() === '^') { i++; return Math.pow(base, segno()); }
        return base;
      }
      function primario() {
        const tk = tokens[i];
        if (!tk) throw new Error('Formula incompleta');
        if (tk.t === 'num') { i++; return tk.v; }
        if (tk.t === '(') { i++; const v = somma(); prendi(')'); return v; }
        throw new Error(`"${tk.t}" fuori posto`);
      }

      const risultato = somma();
      if (i < tokens.length) throw new Error(tokens[i].t === ')' ? 'Parentesi chiusa in più' : `"${tokens[i].t}" fuori posto`);
      if (!Number.isFinite(risultato)) throw new Error('Risultato non valido (es. divisione per zero)');
      return risultato;
    }

    function formattaNumero(n) {
      return n.toLocaleString('it-IT', { maximumFractionDigits: 4 });
    }

    // Testo da mostrare nel box sotto al valore della card
    function testoRisultato(c) {
      try { return formattaNumero(valutaFormula(c.formula, c.valore)); }
      catch (e) { return 'Errore'; }
    }

    // ----- Popup contatore: stesso pannello per "Nuovo" e "Modifica" -----
    const NOTA_SEGNAPOSTO = ['Aggiungi nota...', 'Aggiungi nota o data...'];

    // Senza id crea un nuovo contatore (tasto "Aggiungi"), con id modifica quello esistente (tasto "Salva")
    function apriFormContatore(id = null) {
      const c = id !== null ? contatori.find(x => x.id === id) : null;
      if (id !== null && !c) return;
      const nota = c && !NOTA_SEGNAPOSTO.includes(c.nota) ? c.nota : '';
      const formulaAttiva = !!(c && c.formulaAttiva);

      apriModale(c ? 'Modifica contatore' : 'Nuovo contatore', `
        <form class="form" onsubmit="event.preventDefault(); if (salvaFormContatore(${id})) chiudiModale();">
          <label class="field">
            <span>Titolo</span>
            <input type="text" id="formTitolo" placeholder="Es. Flessioni" maxlength="60" autocomplete="off" value="${escapeHtml(c ? c.titolo : '')}" />
          </label>
          <label class="field">
            <span>Nota <em>(facoltativa)</em></span>
            <input type="text" id="formNota" placeholder="Es. Max 15, oppure una data" maxlength="80" autocomplete="off" value="${escapeHtml(nota)}" />
          </label>
          <label class="field">
            <span>${c ? 'Valore' : 'Valore iniziale'}</span>
            <input type="number" id="formValore" inputmode="numeric" value="${c ? c.valore : 0}" oninput="anteprimaFormula()" />
          </label>

          <!-- Sezione "Avanzate" (aperta in automatico se la formula è già attiva) -->
          <button type="button" class="adv-toggle ${formulaAttiva ? 'open' : ''}" id="advToggle" aria-expanded="${formulaAttiva}" onclick="toggleAvanzate()">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            Avanzate
          </button>
          <div class="adv-section" id="advSection" ${formulaAttiva ? '' : 'hidden'}>
            <label class="check">
              <input type="checkbox" id="formFormulaAttiva" ${formulaAttiva ? 'checked' : ''} onchange="onToggleFormula()" />
              Inserisci formula
            </label>
            <div class="formula-box" id="formulaBox" ${formulaAttiva ? '' : 'hidden'}>
              <input type="text" id="formFormula" class="formula-input" placeholder="=Valore*3" autocomplete="off" autocapitalize="off" spellcheck="false"
                     value="${escapeHtml(c && c.formula ? c.formula : '=Valore')}" oninput="anteprimaFormula()" />
              <div class="formula-help">Usa <b>Valore</b>, numeri, + − * / ^ e parentesi. Es: =Valore^2, =Valore^(1/2), =(Valore+5)/2</div>
              <div class="formula-preview" id="formulaPreview"></div>
            </div>
          </div>
          <button type="submit" hidden></button>
        </form>`, [
        { testo: 'Annulla' },
        { testo: c ? 'Salva' : 'Aggiungi', classe: 'primary', onClick: () => salvaFormContatore(id) }
      ], { divisi: true });
      anteprimaFormula();
      setTimeout(() => document.getElementById('formTitolo').focus(), 50);
    }

    function toggleAvanzate() {
      const sezione = document.getElementById('advSection');
      const btn = document.getElementById('advToggle');
      sezione.hidden = !sezione.hidden;
      btn.classList.toggle('open', !sezione.hidden);
      btn.setAttribute('aria-expanded', String(!sezione.hidden));
    }

    function onToggleFormula() {
      const attiva = document.getElementById('formFormulaAttiva').checked;
      document.getElementById('formulaBox').hidden = !attiva;
      if (attiva) {
        const input = document.getElementById('formFormula');
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
      anteprimaFormula();
    }

    // Mostra il risultato (o l'errore) mentre si scrive la formula
    function anteprimaFormula() {
      const box = document.getElementById('formulaPreview');
      const input = document.getElementById('formFormula');
      if (!box || !input) return;
      input.classList.remove('invalid');
      const valore = parseInt(document.getElementById('formValore').value, 10) || 0;
      try {
        box.textContent = 'Risultato: ' + formattaNumero(valutaFormula(input.value, valore));
        box.classList.remove('error');
      } catch (e) {
        box.textContent = e.message;
        box.classList.add('error');
      }
    }

    // Legge il titolo obbligatorio dal popup; se manca evidenzia il campo e restituisce null
    function titoloDalPopup() {
      const input = document.getElementById('formTitolo');
      const titolo = input.value.trim();
      if (!titolo) {
        input.classList.add('invalid');
        input.focus();
        return null;
      }
      return titolo;
    }

    // Restituisce true se il salvataggio è riuscito (così il popup si chiude)
    function salvaFormContatore(id) {
      const titolo = titoloDalPopup();
      if (!titolo) return false;
      const nota = document.getElementById('formNota').value.trim() || 'Aggiungi nota...';
      const valoreLetto = parseInt(document.getElementById('formValore').value, 10);
      const valore = isNaN(valoreLetto) ? 0 : valoreLetto;

      // Formula: se attiva deve essere valida, altrimenti il popup resta aperto con l'errore
      const formulaAttiva = document.getElementById('formFormulaAttiva').checked;
      const formula = document.getElementById('formFormula').value.trim();
      if (formulaAttiva) {
        try { valutaFormula(formula, valore); }
        catch (e) {
          const input = document.getElementById('formFormula');
          input.classList.add('invalid');
          input.focus();
          return false;
        }
      }

      const dati = { titolo, nota, valore, formulaAttiva, formula };
      if (id === null) {
        contatori.push({ id: Date.now(), ...dati });
      } else {
        const c = contatori.find(x => x.id === id);
        if (c) Object.assign(c, dati);
      }
      salvaStato();
      render();
      return true;
    }

    // ===================== OBIETTIVI =====================
    // Senza id crea un nuovo obiettivo (tasto "Aggiungi"), con id modifica quello esistente (tasto "Salva")
    function apriFormObiettivo(id = null) {
      const o = id !== null ? trovaObiettivo(id) : null;
      if (id !== null && !o) return;

      apriModale(o ? 'Modifica obiettivo' : 'Nuovo obiettivo', `
        <form class="form" onsubmit="event.preventDefault(); if (salvaFormObiettivo(${id})) chiudiModale();">
          <label class="field">
            <span>Titolo</span>
            <input type="text" id="formTitolo" placeholder="Es. 10 trazioni di fila" maxlength="60" autocomplete="off" value="${escapeHtml(o ? o.titolo : '')}" />
          </label>
          <label class="field">
            <span>Descrizione <em>(facoltativa)</em></span>
            <input type="text" id="formDescrizione" placeholder="Es. Entro fine anno" maxlength="120" autocomplete="off" value="${escapeHtml(o ? o.descrizione : '')}" />
          </label>
          <button type="submit" hidden></button>
        </form>`, [
        { testo: 'Annulla' },
        { testo: o ? 'Salva' : 'Aggiungi', classe: 'primary', onClick: () => salvaFormObiettivo(id) }
      ], { divisi: true });
      setTimeout(() => document.getElementById('formTitolo').focus(), 50);
    }

    function salvaFormObiettivo(id) {
      const titolo = titoloDalPopup();
      if (!titolo) return false;
      const descrizione = document.getElementById('formDescrizione').value.trim();

      if (id === null) {
        obiettivi.push({ id: Date.now(), titolo, descrizione, percentuale: 0, note: '' });
      } else {
        const o = trovaObiettivo(id);
        if (o) Object.assign(o, { titolo, descrizione });
      }
      salvaObiettivi();
      renderObiettivi();
      return true;
    }

    function trovaObiettivo(id) { return obiettivi.find(o => o.id === id); }

    // Indicatore circolare con la percentuale al centro
    function anelloPercentuale(p) {
      return `<div class="ring" style="--p:${p}"><span>${p}%</span></div>`;
    }

    function renderObiettivi() {
      const container = document.getElementById('listaObiettivi');
      container.innerHTML = '';

      if (obiettivi.length === 0) {
        container.innerHTML = '<p class="empty">Nessun obiettivo. Premi + per aggiungerne uno!</p>';
        return;
      }

      obiettivi.forEach((o, index) => {
        const inSposta = spostaId === o.id;
        const card = creaCard('obiettivo', o.id, inSposta);
        card.classList.add('goal-card');
        card.addEventListener('click', e => {
          if (e.target.closest('button') || spostaId === o.id || Date.now() - ultimoTrascinamento < 400) return;
          apriObiettivo(o.id);
        });

        const info = `
          <div class="card-info">
            <span class="card-title">${escapeHtml(o.titolo)}</span>
            ${inSposta
              ? '<span class="move-hint">Trascina o usa le frecce</span>'
              : (o.descrizione ? `<span class="goal-desc-short">${escapeHtml(o.descrizione)}</span>` : '')}
          </div>`;

        const controlli = inSposta
          ? controlliSposta('obiettivo', o.id, index, obiettivi.length)
          : `<div class="controls">
               ${anelloPercentuale(o.percentuale || 0)}
               <button class="btn-more" aria-label="Altre azioni" onclick="apriAzioni('obiettivo', ${o.id}, this)">${ICONA_PUNTINI}</button>
             </div>`;

        card.innerHTML = info + controlli;
        container.appendChild(card);
      });
    }

    // ----- Dettaglio obiettivo -----
    let obiettivoAperto = null;

    function apriObiettivo(id) {
      obiettivoAperto = id;
      mostraPagina('obiettivo');
      // Così il tasto "indietro" del telefono riporta all'elenco
      try { history.pushState({ obiettivo: id }, ''); } catch (e) {}
    }

    function tornaAgliObiettivi() {
      let indietro = false;
      try { indietro = !!(history.state && history.state.obiettivo); } catch (e) {}
      if (indietro) history.back();
      else mostraPagina('obiettivi');
    }

    window.addEventListener('popstate', () => {
      if (paginaCorrente === 'obiettivo') mostraPagina('obiettivi');
    });

    function renderDettaglio() {
      const o = trovaObiettivo(obiettivoAperto);
      if (!o) { mostraPagina('obiettivi'); return; }
      document.getElementById('titoloPagina').textContent = o.titolo;
      document.getElementById('goalDesc').textContent = o.descrizione || '';
      document.getElementById('goalNotes').value = o.note || '';
      aggiornaPercentualeUI(o.percentuale || 0);
    }

    // Salva il titolo modificato direttamente nella barra in alto (se vuoto, ripristina il precedente)
    function salvaTitoloDettaglio() {
      const el = document.getElementById('titoloPagina');
      const o = trovaObiettivo(obiettivoAperto);
      if (!o || paginaCorrente !== 'obiettivo') return;
      const nuovo = el.innerText.replace(/\s+/g, ' ').trim().slice(0, 60);
      if (nuovo && nuovo !== o.titolo) {
        o.titolo = nuovo;
        salvaObiettivi();
      }
      renderObiettivi();
      el.textContent = o.titolo;
    }

    // Salvataggio mentre si scrive (così il titolo è aggiornato anche se si esce senza confermare)
    function onInputTitolo() {
      if (paginaCorrente !== 'obiettivo') return;
      const o = trovaObiettivo(obiettivoAperto);
      const nuovo = document.getElementById('titoloPagina').innerText.replace(/\s+/g, ' ').trim().slice(0, 60);
      if (!o || !nuovo) return;
      o.titolo = nuovo;
      salvaObiettivi();
    }

    function onTastoTitolo(e) {
      if (e.target.contentEditable !== 'true') return;
      if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
      if (e.key === 'Escape') {
        const o = trovaObiettivo(obiettivoAperto);
        if (o) e.target.textContent = o.titolo;
        e.target.blur();
      }
    }

    function aggiornaPercentualeUI(p) {
      const slider = document.getElementById('goalSlider');
      slider.value = p;
      slider.style.setProperty('--p', p);
      document.getElementById('topPercent').textContent = p + '%';
    }

    function modificaObiettivo(campo, valore) {
      const o = trovaObiettivo(obiettivoAperto);
      if (!o) return;
      o[campo] = valore;
      salvaObiettivi();
    }

    function onSlider(valore) {
      const p = Math.max(0, Math.min(100, parseInt(valore, 10) || 0));
      aggiornaPercentualeUI(p);
      modificaObiettivo('percentuale', p);
    }

    // ===================== ELIMINAZIONE (verso il cestino) =====================
    function eliminaElemento(tipo, id) {
      const lista = LISTE[tipo].get();
      const indice = lista.findIndex(c => c.id === id);
      if (indice === -1) return;
      const [elemento] = lista.splice(indice, 1);
      cestino.unshift({ ...elemento, tipo, posizione: indice, eliminatoIl: Date.now() });
      LISTE[tipo].salva();
      salvaCestino();
      LISTE[tipo].render();
    }

    // ===================== MENU AZIONI (⋮) =====================
    let azioniId = null;
    let azioniTipo = null;

    function apriAzioni(tipo, id, btn) {
      azioniTipo = tipo;
      azioniId = id;
      const menu = document.getElementById('popMenu');
      const r = btn.getBoundingClientRect();
      menu.classList.add('open');
      btn.classList.add('open');

      // Allinea il menu al bordo destro del pulsante; se non c'è spazio sotto, aprilo sopra
      const h = menu.offsetHeight;
      const sotto = r.bottom + 4 + h <= window.innerHeight - 8;
      menu.style.top = (sotto ? r.bottom + 4 : Math.max(8, r.top - h - 4)) + 'px';
      menu.style.left = Math.max(8, r.right - menu.offsetWidth) + 'px';
      menu.style.transformOrigin = sotto ? 'top right' : 'bottom right';

      document.getElementById('popOverlay').classList.add('open');
    }

    function chiudiAzioni() {
      document.getElementById('popMenu').classList.remove('open');
      document.getElementById('shareMenu').classList.remove('open');
      document.getElementById('popOverlay').classList.remove('open');
      document.querySelectorAll('.btn-more.open').forEach(b => b.classList.remove('open'));
    }

    function azione(tipoAzione) {
      const id = azioniId, tipo = azioniTipo;
      chiudiAzioni();
      if (tipoAzione === 'elimina') eliminaElemento(tipo, id);
      if (tipoAzione === 'modifica') apriModifica(tipo, id);
      if (tipoAzione === 'sposta') iniziaSposta(id);
    }

    // ===================== MODALE =====================
    // azioni: [{ testo, classe, onClick }] — se onClick restituisce false il popup resta aperto
    // opzioni.divisi: primo pulsante a sinistra, gli altri a destra
    function apriModale(titolo, corpo, azioni = [], opzioni = {}) {
      document.getElementById('modalTitolo').textContent = titolo;
      const body = document.getElementById('modalBody');
      body.innerHTML = corpo;
      body.style.minHeight = '';
      const box = document.getElementById('modalActions');
      box.innerHTML = '';
      box.classList.toggle('divisi', !!opzioni.divisi);
      azioni.forEach(a => {
        const b = document.createElement('button');
        b.className = 'btn ' + (a.classe || '');
        b.textContent = a.testo;
        b.onclick = () => {
          if (a.onClick && a.onClick() === false) return;
          chiudiModale();
        };
        box.appendChild(b);
      });
      box.style.display = azioni.length ? 'flex' : 'none';
      document.getElementById('modalOverlay').classList.add('open');
    }

    function chiudiModale() {
      document.getElementById('modalOverlay').classList.remove('open');
    }

    function conferma(titolo, messaggio, testoOk, onOk) {
      apriModale(titolo, `<p style="margin:0">${messaggio}</p>`, [
        { testo: 'Annulla' },
        { testo: testoOk, classe: 'danger', onClick: onOk }
      ]);
      document.getElementById('modalBody').style.minHeight = '0';
    }

    function apriModifica(tipo, id) {
      if (tipo === 'obiettivo') apriFormObiettivo(id);
      else apriFormContatore(id);
    }

    // ===================== SPOSTAMENTO =====================
    // Due modi per riordinare (contatori e obiettivi):
    // 1) tieni premuto su una card (~0,4 s) e trascinala;
    // 2) menu ⋮ → Sposta: la card resta selezionata, la trascini subito
    //    oppure usi le frecce ▲ ▼, e premi "Fatto" per terminare.
    const LONG_PRESS_MS = 400;
    let spostaId = null;          // id della card in modalità "Sposta"
    let pressione = null;         // pressione prolungata in attesa
    let trascina = null;          // trascinamento in corso
    let ultimoTrascinamento = 0;  // per non aprire un obiettivo appena rilasciato

    function iniziaSposta(id) {
      spostaId = id;
      renderListe();
    }

    function fineSposta() {
      if (spostaId === null) return;
      spostaId = null;
      renderListe();
    }

    function spostaDiUno(tipo, id, delta) {
      const lista = LISTE[tipo].get();
      const i = lista.findIndex(c => c.id === id);
      const j = i + delta;
      if (i === -1 || j < 0 || j >= lista.length) return;
      [lista[i], lista[j]] = [lista[j], lista[i]];
      LISTE[tipo].salva();
      LISTE[tipo].render();
    }

    function controlliSposta(tipo, id, index, totale) {
      return `<div class="controls">
          <button class="btn-step" aria-label="Sposta su" onclick="spostaDiUno('${tipo}', ${id}, -1)" ${index === 0 ? 'disabled' : ''}>▲</button>
          <button class="btn-step" aria-label="Sposta giù" onclick="spostaDiUno('${tipo}', ${id}, 1)" ${index === totale - 1 ? 'disabled' : ''}>▼</button>
          <button class="btn-done" onclick="fineSposta()">Fatto</button>
        </div>`;
    }

    // Crea la card base (comune a contatori e obiettivi) con i gesti di spostamento
    function creaCard(tipo, id, inSposta) {
      const card = document.createElement('div');
      card.className = 'card' + (inSposta ? ' moving' : '');
      card.dataset.id = id;
      card.dataset.tipo = tipo;
      card.addEventListener('pointerdown', e => onCardPointerDown(e, id));
      card.addEventListener('contextmenu', e => { if (!e.target.closest('.card-note, input')) e.preventDefault(); });
      return card;
    }

    function onCardPointerDown(e, id) {
      if (e.button !== 0) return;
      if (e.target.closest('button, input, textarea, .card-note')) return;
      const card = e.currentTarget;

      if (spostaId === id) {
        e.preventDefault();
        avviaTrascinamento(card, e.clientY);
        return;
      }

      pressione = {
        card, x: e.clientX, y: e.clientY,
        timer: setTimeout(() => {
          const p = pressione;
          pressione = null;
          if (p) avviaTrascinamento(p.card, p.y);
        }, LONG_PRESS_MS)
      };
    }

    function annullaPressione() {
      if (!pressione) return;
      clearTimeout(pressione.timer);
      pressione = null;
    }

    function avviaTrascinamento(card, y) {
      const r = card.getBoundingClientRect();
      trascina = { card, startY: y, startTop: card.offsetTop, centro: r.top + r.height / 2 };
      card.classList.add('dragging');
      document.body.classList.add('is-dragging');
      if (navigator.vibrate) navigator.vibrate(15);
    }

    function aggiornaTrascinamento(y) {
      const { card } = trascina;
      const centro = trascina.centro + (y - trascina.startY);
      const prev = card.previousElementSibling;
      const next = card.nextElementSibling;

      if (prev && centro < prev.getBoundingClientRect().top + prev.offsetHeight / 2) {
        card.parentNode.insertBefore(card, prev);
      } else if (next && centro > next.getBoundingClientRect().top + next.offsetHeight / 2) {
        card.parentNode.insertBefore(next, card);
      }
      const offset = (y - trascina.startY) - (card.offsetTop - trascina.startTop);
      card.style.transform = `translateY(${offset}px)`;
    }

    function terminaTrascinamento() {
      const { card } = trascina;
      trascina = null;
      ultimoTrascinamento = Date.now();
      card.classList.remove('dragging');
      card.style.transform = '';
      document.body.classList.remove('is-dragging');

      // Nuovo ordine = ordine delle card nel DOM
      const tipo = card.dataset.tipo;
      const ordine = [...card.parentNode.querySelectorAll('.card')].map(el => Number(el.dataset.id));
      LISTE[tipo].get().sort((a, b) => ordine.indexOf(a.id) - ordine.indexOf(b.id));
      LISTE[tipo].salva();
      LISTE[tipo].render();
    }

    document.addEventListener('pointermove', e => {
      if (pressione) {
        // Se il dito si muove prima del tempo, è uno scroll: annulla
        if (Math.hypot(e.clientX - pressione.x, e.clientY - pressione.y) > 8) annullaPressione();
        return;
      }
      if (trascina) {
        e.preventDefault();
        aggiornaTrascinamento(e.clientY);
      }
    });
    document.addEventListener('pointerup', () => { annullaPressione(); if (trascina) terminaTrascinamento(); });
    document.addEventListener('pointercancel', () => { annullaPressione(); if (trascina) terminaTrascinamento(); });
    // Su touch blocca lo scroll della pagina mentre si trascina
    document.addEventListener('touchmove', e => { if (trascina) e.preventDefault(); }, { passive: false });

    // ===================== RENDER CONTATORI =====================
    function render() {
      const container = document.getElementById('app');
      container.innerHTML = '';

      if (contatori.length === 0) {
        container.innerHTML = '<p class="empty">Nessun contatore. Aggiungine uno!</p>';
        return;
      }

      contatori.forEach((c, index) => {
        const inSposta = spostaId === c.id;
        const card = creaCard('contatore', c.id, inSposta);

        const info = `
          <div class="card-info">
            <span class="card-title">${escapeHtml(c.titolo)}</span>
            ${inSposta
              ? '<span class="move-hint">Trascina o usa le frecce</span>'
              : `<span class="card-note" contenteditable="true" onblur="modificaNota(${c.id}, this.innerText)">${escapeHtml(c.nota || 'Aggiungi nota...')}</span>`}
          </div>`;

        // Se la formula è attiva, sotto al valore compare il box con il risultato
        const conFormula = c.formulaAttiva && c.formula;
        const controlli = inSposta
          ? controlliSposta('contatore', c.id, index, contatori.length)
          : `<div class="controls ${conFormula ? 'con-formula' : ''}">
               <button class="btn-step" onclick="modificaPulsante(${c.id}, -1)">-</button>
               <div class="value-col">
                 <input type="number" class="counter-input" value="${c.valore}" oninput="modificaDiretta(${c.id}, this.value)" />
                 ${conFormula ? `<div class="formula-result" id="ris-${c.id}" title="${escapeHtml(c.formula)}">${testoRisultato(c)}</div>` : ''}
               </div>
               <button class="btn-step" onclick="modificaPulsante(${c.id}, 1)">+</button>
               <button class="btn-more" aria-label="Altre azioni" onclick="apriAzioni('contatore', ${c.id}, this)">${ICONA_PUNTINI}</button>
             </div>`;

        card.innerHTML = info + controlli;
        container.appendChild(card);
      });
    }

    // ===================== LISTA DELLA SPESA =====================
    // Funziona come un blocco note: ogni riga ha una casella.
    // Spuntata = da comprare (testo ben visibile); non spuntata = non serve / già nel carrello (testo opaco).
    // Invio crea una nuova riga, Backspace a inizio riga la unisce alla precedente, le frecce ↑ ↓ spostano tra le righe.
    //
    // Ogni tab in basso è un blocco note indipendente. "spesa" punta sempre alle righe della tab attiva.
    function nuovaRiga(testo = '') {
      return { id: Date.now() + Math.random(), testo, check: true };
    }

    function caricaTabSpesa() {
      const dati = leggi(SPESA_TABS_KEY, null);
      if (dati && Array.isArray(dati.tabs) && dati.tabs.length) return dati;
      // Prima versione: una sola lista salvata come array → diventa la prima tab
      return { attiva: 1, tabs: [{ id: 1, nome: 'Spesa', righe: leggi(SPESA_KEY, []) }] };
    }

    let spesaDati = caricaTabSpesa();
    let spesa = tabAttiva().righe;

    function tabAttiva() {
      return spesaDati.tabs.find(t => t.id === spesaDati.attiva) || spesaDati.tabs[0];
    }

    function salvaSpesa() { scrivi(SPESA_TABS_KEY, spesaDati); }

    function selezionaTab(id) {
      if (id === spesaDati.attiva) { rinominaTab(id); return; } // tocco sulla tab attiva = modifica nome
      spesaDati.attiva = id;
      spesa = tabAttiva().righe;
      salvaSpesa();
      renderSpesa();
    }

    function aggiungiTab() {
      const id = Date.now();
      spesaDati.tabs.push({ id, nome: 'Lista ' + (spesaDati.tabs.length + 1), righe: [nuovaRiga()] });
      spesaDati.attiva = id;
      spesa = tabAttiva().righe;
      salvaSpesa();
      renderSpesa();
      rinominaTab(id);
    }

    function eliminaTab(id) {
      const tab = spesaDati.tabs.find(t => t.id === id);
      if (!tab || spesaDati.tabs.length < 2) return;
      conferma('Elimina tab', `La tab "${escapeHtml(tab.nome)}" e il suo contenuto verranno eliminati. L'operazione non si può annullare.`, 'Elimina', () => {
        const i = spesaDati.tabs.indexOf(tab);
        spesaDati.tabs.splice(i, 1);
        spesaDati.attiva = spesaDati.tabs[Math.max(0, i - 1)].id;
        spesa = tabAttiva().righe;
        salvaSpesa();
        renderSpesa();
      });
    }

    // Trasforma il titolo della tab in un campo modificabile
    function rinominaTab(id) {
      const tab = spesaDati.tabs.find(t => t.id === id);
      const el = document.querySelector(`#tabSpesa .tab[data-id="${id}"] .tab-nome`);
      if (!tab || !el) return;
      const input = document.createElement('input');
      input.className = 'tab-input';
      input.value = tab.nome;
      input.maxLength = 30;
      input.size = Math.max(4, tab.nome.length);
      let finito = false;
      const fine = (salva) => {
        if (finito) return;
        finito = true;
        const nome = input.value.trim();
        if (salva && nome) { tab.nome = nome; salvaSpesa(); }
        renderTabs();
      };
      input.oninput = () => { input.size = Math.max(4, input.value.length); };
      input.onkeydown = e => {
        if (e.key === 'Enter') { e.preventDefault(); fine(true); }
        if (e.key === 'Escape') fine(false);
      };
      input.onblur = () => fine(true);
      input.onclick = e => e.stopPropagation();
      el.replaceWith(input);
      input.focus();
      input.select();
    }

    function renderTabs() {
      const bar = document.getElementById('tabSpesa');
      const multiple = spesaDati.tabs.length > 1;
      bar.innerHTML = spesaDati.tabs.map(t => {
        const attiva = t.id === spesaDati.attiva;
        return `
          <div class="tab ${attiva ? 'active' : ''}" data-id="${t.id}" role="tab" aria-selected="${attiva}" onclick="selezionaTab(${t.id})">
            <span class="tab-nome">${escapeHtml(t.nome)}</span>
            ${attiva && multiple ? `<button class="tab-close" aria-label="Elimina tab" onclick="event.stopPropagation(); eliminaTab(${t.id})">✕</button>` : ''}
          </div>`;
      }).join('') + `<button class="tab tab-add" aria-label="Nuova tab" onclick="aggiungiTab()">+</button>`;
      const attivaEl = bar.querySelector('.tab.active');
      if (attivaEl) attivaEl.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }

    // ----- Condivisione: copia solo le voci spuntate -----
    function righeSpuntate(tab) {
      return tab.righe.filter(r => r.check && r.testo.trim()).map(r => '- ' + r.testo.trim());
    }

    function testoDaCondividere(tutto) {
      const tabs = tutto ? spesaDati.tabs : [tabAttiva()];
      return tabs
        .map(t => ({ nome: t.nome, righe: righeSpuntate(t) }))
        .filter(t => t.righe.length)
        .map(t => `🛒 ${t.nome}\n${t.righe.join('\n')}`)
        .join('\n\n');
    }

    async function copiaNegliAppunti(testo) {
      try {
        await navigator.clipboard.writeText(testo);
        return true;
      } catch (e) {
        // Metodo alternativo per browser senza accesso agli appunti
        const ta = document.createElement('textarea');
        ta.value = testo;
        ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
        document.body.appendChild(ta);
        ta.select();
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (err) {}
        ta.remove();
        return ok;
      }
    }

    async function condividi(tutto) {
      chiudiAzioni();
      const testo = testoDaCondividere(tutto);
      if (!testo) {
        mostraToast('Nessuna voce spuntata da copiare');
        return;
      }
      const ok = await copiaNegliAppunti(testo);
      mostraToast(ok ? 'Lista copiata! Incollala in un\'app di messaggi' : 'Impossibile copiare negli appunti');
    }

    function apriMenuCondividi(btn) {
      const menu = document.getElementById('shareMenu');
      const r = btn.getBoundingClientRect();
      menu.classList.add('open');
      menu.style.top = (r.bottom + 6) + 'px';
      menu.style.left = Math.max(8, r.right - menu.offsetWidth) + 'px';
      menu.style.transformOrigin = 'top right';
      document.getElementById('popOverlay').classList.add('open');
    }

    let toastTimer = null;
    function mostraToast(testo) {
      const t = document.getElementById('toast');
      t.textContent = testo;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
    }

    function renderSpesa(focusIndex = null, caret = 0) {
      renderTabs();
      if (spesa.length === 0) spesa.push(nuovaRiga());
      const box = document.getElementById('listaSpesa');
      box.innerHTML = spesa.map((r, i) => `
        <div class="note-line ${r.check ? 'checked' : ''}">
          <input type="checkbox" ${r.check ? 'checked' : ''} aria-label="Da comprare" onchange="spuntaRiga(${i}, this.checked)" />
          <input type="text" class="note-text" value="${escapeHtml(r.testo)}" data-i="${i}"
                 placeholder="${i === 0 && spesa.length === 1 ? 'Scrivi cosa comprare...' : ''}"
                 autocomplete="off" oninput="scriviRiga(${i}, this.value)" onkeydown="tastoRiga(event, ${i})" onpaste="incollaRighe(event, ${i})" />
        </div>`).join('');
      if (focusIndex !== null) focusRiga(focusIndex, caret);
    }

    function focusRiga(i, caret) {
      const input = document.querySelector(`#listaSpesa .note-text[data-i="${i}"]`);
      if (!input) return;
      input.focus();
      const pos = caret === 'fine' ? input.value.length : caret;
      input.setSelectionRange(pos, pos);
    }

    function focusUltimaRiga() {
      if (spesa[spesa.length - 1].testo !== '') {
        spesa.push(nuovaRiga());
        salvaSpesa();
        renderSpesa(spesa.length - 1, 0);
      } else focusRiga(spesa.length - 1, 'fine');
    }

    function scriviRiga(i, testo) {
      spesa[i].testo = testo;
      salvaSpesa();
    }

    function spuntaRiga(i, valore) {
      spesa[i].check = valore;
      salvaSpesa();
      document.querySelectorAll('#listaSpesa .note-line')[i].classList.toggle('checked', valore);
    }

    function tastoRiga(e, i) {
      const input = e.target;
      const inizio = input.selectionStart, fine = input.selectionEnd;

      if (e.key === 'Enter') {
        // Divide la riga nel punto del cursore
        e.preventDefault();
        const prima = input.value.slice(0, inizio), dopo = input.value.slice(fine);
        spesa[i].testo = prima;
        spesa.splice(i + 1, 0, nuovaRiga(dopo));
        salvaSpesa();
        renderSpesa(i + 1, 0);
      } else if (e.key === 'Backspace' && inizio === 0 && fine === 0 && i > 0) {
        // Unisce alla riga precedente
        e.preventDefault();
        const pos = spesa[i - 1].testo.length;
        spesa[i - 1].testo += spesa[i].testo;
        spesa.splice(i, 1);
        salvaSpesa();
        renderSpesa(i - 1, pos);
      } else if (e.key === 'Delete' && inizio === input.value.length && fine === inizio && i < spesa.length - 1) {
        // Unisce la riga successiva a questa
        e.preventDefault();
        spesa[i].testo += spesa[i + 1].testo;
        spesa.splice(i + 1, 1);
        salvaSpesa();
        renderSpesa(i, inizio);
      } else if (e.key === 'ArrowUp' && i > 0) {
        e.preventDefault();
        focusRiga(i - 1, Math.min(inizio, spesa[i - 1].testo.length));
      } else if (e.key === 'ArrowDown' && i < spesa.length - 1) {
        e.preventDefault();
