        focusRiga(i + 1, Math.min(inizio, spesa[i + 1].testo.length));
      }
    }

    // Incollando un testo su più righe, ogni riga diventa una voce della lista
    function incollaRighe(e, i) {
      const testo = (e.clipboardData || window.clipboardData).getData('text');
      if (!testo || !/[\r\n]/.test(testo)) return;
      e.preventDefault();
      const input = e.target;
      const prima = input.value.slice(0, input.selectionStart), dopo = input.value.slice(input.selectionEnd);
      const righe = testo.replace(/\r/g, '').split('\n');
      const ultimo = righe.length - 1;
      spesa[i].testo = prima + righe[0];
      const nuove = righe.slice(1).map((t, k) => nuovaRiga(k === ultimo - 1 ? t + dopo : t));
      if (ultimo === 0) spesa[i].testo += dopo;
      spesa.splice(i + 1, 0, ...nuove);
      salvaSpesa();
      renderSpesa(i + ultimo, righe[ultimo].length);
    }

    // ===================== CESTINO =====================
    function aggiornaBadgeCestino() {
      document.getElementById('badgeCestino').textContent = cestino.length || '';
    }

    function ripristina(id) {
      const i = cestino.findIndex(c => c.id === id);
      if (i === -1) return;
      const [{ posizione, eliminatoIl, tipo = 'contatore', ...elemento }] = cestino.splice(i, 1);
      const lista = LISTE[tipo].get();
      // Torna nella posizione originale (o in fondo se la lista ora è più corta)
      lista.splice(Math.min(posizione ?? lista.length, lista.length), 0, elemento);
      LISTE[tipo].salva();
      salvaCestino();
      LISTE[tipo].render();
      renderCestino();
    }

    function eliminaDefinitivo(id) {
      const el = cestino.find(c => c.id === id);
      if (!el) return;
      conferma('Elimina definitivamente', `"${escapeHtml(el.titolo)}" verrà eliminato per sempre. L'operazione non si può annullare.`, 'Elimina', () => {
        cestino = cestino.filter(c => c.id !== id);
        salvaCestino();
        renderCestino();
      });
    }

    function svuotaCestino() {
      conferma('Svuota cestino', `Tutti gli elementi (${cestino.length}) verranno eliminati per sempre. L'operazione non si può annullare.`, 'Svuota', () => {
        cestino = [];
        salvaCestino();
        renderCestino();
      });
    }

    function formattaData(ts) {
      const d = new Date(ts);
      return d.toLocaleDateString('it-IT') + ' ' + d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
    }

    function dettagliCestino(c) {
      if (c.tipo === 'obiettivo') {
        return `Obiettivo · ${c.percentuale || 0}%` + (c.descrizione ? ` · ${escapeHtml(c.descrizione)}` : '');
      }
      return `Contatore · Valore: ${c.valore}` + (c.nota ? ` · ${escapeHtml(c.nota)}` : '');
    }

    function renderCestino() {
      const bar = document.getElementById('trashBar');
      const list = document.getElementById('trashList');

      if (cestino.length === 0) {
        bar.innerHTML = '';
        list.innerHTML = '<p class="empty">Il cestino è vuoto.</p>';
        return;
      }

      bar.innerHTML = `
        <span class="muted">${cestino.length} ${cestino.length === 1 ? 'elemento' : 'elementi'}</span>
        <button class="btn danger-outline" onclick="svuotaCestino()">Svuota cestino</button>`;

      list.innerHTML = cestino.map(c => `
        <div class="card trash-item">
          <div class="card-info">
            <span class="card-title">${escapeHtml(c.titolo)}</span>
            <span class="trash-meta">${dettagliCestino(c)}</span>
            <span class="trash-meta">Eliminato il ${formattaData(c.eliminatoIl)}</span>
          </div>
          <div class="trash-actions">
            <button class="btn danger-outline" onclick="eliminaDefinitivo(${c.id})">Elimina</button>
            <button class="btn primary" onclick="ripristina(${c.id})">Ripristina</button>
          </div>
        </div>`).join('');
    }

    function escapeHtml(text) {
      return text ? String(text).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m])) : '';
    }

    applicaTema();
    aggiornaBadgeCestino();
    renderListe();
    mostraPagina('contatori');

    // REGISTRAZIONE SERVICE WORKER
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('Service Worker Registrato'))
        .catch(err => console.error('Errore SW:', err));
    }
  </script>
</body>
</html>
